<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{link:/}}?intro=replay">{{s:brand}}</a>
    <nav class="nav" aria-label="{{s:nav.aria}}">
      <a href="{{link:/}}?intro=skip" data-home-nav{{current:home}}>{{s:nav.home}}</a>
      <a href="{{link:/projects/}}"{{current:projects}}>{{s:nav.projects}}</a>
      <a href="{{link:/about/}}"{{current:about}}>{{s:nav.about}}</a>
      <a href="{{link:/resume/}}"{{current:resume}}>{{s:nav.resume}}</a>
      <a href="{{link:/}}#contact">{{s:nav.contact}}</a>
    </nav>{{lang_switch}}
      <button type="button" class="motion-toggle" id="motion-toggle" aria-pressed="false" data-reduce-label="{{s:motion.reduce}}" data-reduced-label="{{s:motion.reduced}}">{{s:motion.reduce}}</button>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="{{s:theme.aria}}" title="{{s:theme.title}}" data-to-day="{{s:theme.to_day}}" data-to-night="{{s:theme.to_night}}">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
      </button>
  </div>
</header>
