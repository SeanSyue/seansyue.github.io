<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tetherlock：插上就打開，拔掉就上鎖</title>
  <desc>受保護的工作區要三件事同時成立才會打開：允許的帳號、簽過名的授權隨身碟、密碼。拔掉隨身碟就會再次上鎖。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f47067"/>
    </marker>
    <style>
      .title{font-size:34px;font-weight:700;fill:#e6edf3}
      .pill{fill:#161b22;stroke:#3d444d;stroke-width:1.5}
      .label{font-size:21px;font-weight:600;fill:#e6edf3}
      .icon{fill:none;stroke:#39c5cf;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .iconFill{fill:#39c5cf}
      .plus{font-size:26px;font-weight:700;fill:#6e7681}
      .open{fill:#0f2a1a;stroke:#3fb950;stroke-width:2}
      .locked{fill:#161b22;stroke:#6e7681;stroke-width:2}
      .stateBig{font-size:28px;font-weight:700}
      .note{font-size:15px;fill:#8b949e}
      .red{font-size:18px;font-weight:600;fill:#f47067}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" class="title">插上就打開，拔掉就上鎖。</text>

  <!-- three conditions -->
  <rect x="60" y="112" width="320" height="64" rx="32" class="pill"/>
  <circle cx="104" cy="134" r="9" class="icon"/>
  <path d="M88,160 C88,148 120,148 120,160" class="icon"/>
  <text x="140" y="152" class="label">允許的帳號</text>

  <text x="220" y="210" text-anchor="middle" class="plus">+</text>

  <rect x="60" y="222" width="320" height="64" rx="32" class="pill"/>
  <rect x="88" y="244" width="30" height="20" rx="4" class="icon"/>
  <rect x="118" y="248" width="10" height="12" rx="1" class="icon"/>
  <text x="140" y="262" class="label">簽過名的 USB 隨身碟</text>

  <text x="220" y="320" text-anchor="middle" class="plus">+</text>

  <rect x="60" y="332" width="320" height="64" rx="32" class="pill"/>
  <circle cx="96" cy="364" r="8" class="icon"/>
  <path d="M104,364 L126,364 M120,364 L120,372 M126,364 L126,370" class="icon"/>
  <text x="140" y="372" class="label">密碼</text>

  <!-- arrow to open -->
  <path d="M400,254 L516,254" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- open -->
  <rect x="530" y="170" width="260" height="168" rx="20" class="open"/>
  <path d="M636,236 L636,218 C636,198 664,198 664,212" class="icon" style="stroke:#3fb950"/>
  <rect x="626" y="236" width="48" height="36" rx="6" fill="#3fb950"/>
  <text x="660" y="312" text-anchor="middle" class="stateBig" fill="#3fb950">工作區已打開</text>

  <!-- arrow to locked -->
  <path d="M800,254 L916,254" stroke="#f47067" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowRed)"/>
  <text x="858" y="236" text-anchor="middle" class="red">拔掉隨身碟</text>

  <!-- locked -->
  <rect x="930" y="170" width="210" height="168" rx="20" class="locked"/>
  <path d="M1021,236 L1021,218 C1021,198 1049,198 1049,218 L1049,236" class="icon" style="stroke:#9da7b3"/>
  <rect x="1011" y="236" width="48" height="36" rx="6" fill="#9da7b3"/>
  <text x="1035" y="312" text-anchor="middle" class="stateBig" fill="#c9d1d9">已上鎖</text>

  <!-- method, small -->
  <text x="600" y="420" text-anchor="middle" class="note">Ed25519 簽章的 token · 密碼與 scrypt 驗證值比對 · 輸入密碼後和每一輪檢查時，都重新確認隨身碟</text>
</svg>
