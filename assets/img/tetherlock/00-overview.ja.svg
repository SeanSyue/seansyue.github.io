<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="'Yu Gothic', YuGothic, 'Hiragino Sans', 'Noto Sans JP', Meiryo, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tetherlock：挿せば開き、抜けばロック</title>
  <desc>保護されたワークスペースを開くには、許可されたアカウント、署名済みの認証用ドライブ、パスワードの3つがそろう必要がある。ドライブを抜くと再びロックされる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title{font-size:34px;font-weight:700;fill:#0f172a}
      .pill{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .label{font-size:21px;font-weight:600;fill:#0f172a}
      .icon{fill:none;stroke:#0e7490;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .iconFill{fill:#0e7490}
      .plus{font-size:26px;font-weight:700;fill:#94a3b8}
      .open{fill:#f0fdf4;stroke:#15803d;stroke-width:2}
      .locked{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}
      .stateBig{font-size:28px;font-weight:700}
      .note{font-size:15px;fill:#64748b}
      .red{font-size:16px;font-weight:600;fill:#b91c1c}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" class="title">挿せば開く。抜けばロック。</text>

  <!-- three conditions -->
  <rect x="60" y="112" width="320" height="64" rx="32" class="pill"/>
  <circle cx="104" cy="134" r="9" class="icon"/>
  <path d="M88,160 C88,148 120,148 120,160" class="icon"/>
  <text x="140" y="152" class="label">許可されたアカウント</text>

  <text x="220" y="210" text-anchor="middle" class="plus">+</text>

  <rect x="60" y="222" width="320" height="64" rx="32" class="pill"/>
  <rect x="88" y="244" width="30" height="20" rx="4" class="icon"/>
  <rect x="118" y="248" width="10" height="12" rx="1" class="icon"/>
  <text x="140" y="262" class="label">署名済みUSBドライブ</text>

  <text x="220" y="320" text-anchor="middle" class="plus">+</text>

  <rect x="60" y="332" width="320" height="64" rx="32" class="pill"/>
  <circle cx="96" cy="364" r="8" class="icon"/>
  <path d="M104,364 L126,364 M120,364 L120,372 M126,364 L126,370" class="icon"/>
  <text x="140" y="372" class="label">パスワード</text>

  <!-- arrow to open -->
  <path d="M400,254 L516,254" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- open -->
  <rect x="530" y="170" width="260" height="168" rx="20" class="open"/>
  <path d="M636,236 L636,218 C636,198 664,198 664,212" class="icon" style="stroke:#15803d"/>
  <rect x="626" y="236" width="48" height="36" rx="6" fill="#15803d"/>
  <text x="660" y="312" text-anchor="middle" class="stateBig" fill="#15803d">ロック解除</text>

  <!-- arrow to locked -->
  <path d="M800,254 L916,254" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowRed)"/>
  <text x="858" y="236" text-anchor="middle" class="red">ドライブを抜く</text>

  <!-- locked -->
  <rect x="930" y="170" width="210" height="168" rx="20" class="locked"/>
  <path d="M1021,236 L1021,218 C1021,198 1049,198 1049,218 L1049,236" class="icon" style="stroke:#475569"/>
  <rect x="1011" y="236" width="48" height="36" rx="6" fill="#475569"/>
  <text x="1035" y="312" text-anchor="middle" class="stateBig" fill="#334155">ロック中</text>

  <!-- method, small -->
  <text x="600" y="420" text-anchor="middle" class="note">Ed25519で署名したトークン · パスワードはscryptの検証用データと照合 · ドライブはパスワードの後と毎回のチェックで再確認</text>
</svg>
