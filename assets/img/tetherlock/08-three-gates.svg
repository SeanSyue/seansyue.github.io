<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>One poll tick: three gates, in this order</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .h{font-size:20px;font-weight:700;fill:#0f172a}
      .sub{font-size:14px;fill:#475569}
      .step{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .gate{fill:#ecfeff;stroke:#0e7490;stroke-width:1.5}
      .red{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.5}
      .grn{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}
      .pre{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12.5px;fill:#334155}
      .c{font-size:11.5px;fill:#64748b;font-family:Consolas, 'Cascadia Mono', monospace}
      .n{font-size:12px;fill:#64748b;font-style:italic}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .no{stroke:#b91c1c;stroke-width:1.4;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="30" y="40" class="h">One check cycle: three gates, always in this order</text>
  <text x="30" y="64" class="sub">The host calls poll() on a timer. Each gate must pass before the next one is even asked.</text>

  <!-- happy path -->
  <rect x="30" y="110" width="160" height="104" rx="10" class="step"/>
  <text x="46" y="140" class="t">Timer tick</text>
  <text x="46" y="162" class="s">host calls poll()</text>
  <text x="46" y="180" class="s">every few seconds</text>
  <text x="46" y="200" class="c">WorkspaceMonitor.poll</text>

  <rect x="225" y="110" width="160" height="104" rx="10" class="gate"/>
  <text x="241" y="140" class="t">Gate 1 · Account</text>
  <text x="241" y="162" class="s">Is this account allowed</text>
  <text x="241" y="180" class="s">into protected areas?</text>
  <text x="241" y="200" class="c">is_authorized()</text>

  <rect x="420" y="110" width="160" height="104" rx="10" class="gate"/>
  <text x="436" y="140" class="t">Gate 2 · Device</text>
  <text x="436" y="162" class="s">Signed token on a drive?</text>
  <text x="436" y="180" class="s">signer, scope, expiry, disk</text>
  <text x="436" y="200" class="c">verify_token_file</text>

  <rect x="615" y="110" width="160" height="104" rx="10" class="gate"/>
  <text x="631" y="140" class="t">Gate 3 · Password</text>
  <text x="631" y="162" class="s">Ask for this scope's</text>
  <text x="631" y="180" class="s">password</text>
  <text x="631" y="200" class="c">prompt_password(scope)</text>

  <rect x="810" y="110" width="160" height="104" rx="10" class="step"/>
  <text x="826" y="140" class="t">Check again</text>
  <text x="826" y="162" class="s">Same token and device?</text>
  <text x="826" y="180" class="s">Same session, allowed?</text>
  <text x="826" y="200" class="c">revalidate_token</text>

  <rect x="1005" y="110" width="165" height="104" rx="10" class="grn"/>
  <text x="1021" y="140" class="t">Open</text>
  <text x="1021" y="162" class="s">password matches the</text>
  <text x="1021" y="180" class="s">verifier → host opens it</text>
  <text x="1021" y="200" class="c">on_unlock(grant)</text>

  <line x1="190" y1="162" x2="222" y2="162" class="ln" marker-end="url(#a)"/>
  <line x1="385" y1="162" x2="417" y2="162" class="ln" marker-end="url(#a)"/>
  <line x1="580" y1="162" x2="612" y2="162" class="ln" marker-end="url(#a)"/>
  <line x1="775" y1="162" x2="807" y2="162" class="ln" marker-end="url(#a)"/>
  <line x1="970" y1="162" x2="1002" y2="162" class="ln" marker-end="url(#a)"/>

  <!-- refusals -->
  <line x1="305" y1="214" x2="305" y2="276" class="no" marker-end="url(#r)"/>
  <rect x="225" y="280" width="160" height="96" rx="10" class="red"/>
  <text x="241" y="306" class="t">Not allowed</text>
  <text x="241" y="328" class="s">No prompt is shown.</text>
  <text x="241" y="346" class="s">Anything open is</text>
  <text x="241" y="364" class="s">locked.</text>

  <line x1="500" y1="214" x2="500" y2="276" class="no" marker-end="url(#r)"/>
  <rect x="420" y="280" width="160" height="96" rx="10" class="red"/>
  <text x="436" y="306" class="t">No valid token</text>
  <text x="436" y="328" class="s">Nothing happens. Invalid</text>
  <text x="436" y="346" class="s">files are skipped with</text>
  <text x="436" y="364" class="s">no message.</text>

  <line x1="695" y1="214" x2="695" y2="276" class="no" marker-end="url(#r)"/>
  <rect x="615" y="280" width="160" height="96" rx="10" class="red"/>
  <text x="631" y="306" class="t">Cancelled</text>
  <text x="631" y="328" class="s">Not asked again for</text>
  <text x="631" y="346" class="s">60 s (a setting).</text>

  <line x1="890" y1="214" x2="890" y2="276" class="no" marker-end="url(#r)"/>
  <rect x="810" y="280" width="160" height="96" rx="10" class="red"/>
  <text x="826" y="306" class="t">Changed</text>
  <text x="826" y="328" class="s">Drive swapped or signed</text>
  <text x="826" y="346" class="s">out → answer discarded.</text>
  <text x="826" y="364" class="s">Drive swap: retry in 20 s.</text>

  <line x1="1087" y1="214" x2="1087" y2="276" class="no" marker-end="url(#r)"/>
  <rect x="1005" y="280" width="165" height="96" rx="10" class="red"/>
  <text x="1021" y="306" class="t">Wrong password</text>
  <text x="1021" y="328" class="s">or the module fails to</text>
  <text x="1021" y="346" class="s">load → refused; retry</text>
  <text x="1021" y="364" class="s">after 20 s (setting).</text>

  <!-- before the gates -->
  <rect x="30" y="412" width="1140" height="112" rx="12" class="pre"/>
  <text x="50" y="440" class="t">Before the gates, on every tick</text>
  <text x="50" y="464" class="s">Every area that is already open is re-checked: token file still there, signature still valid, same token.</text>
  <text x="50" y="484" class="s">If not — or if the check itself fails — that area alone is locked; areas unlocked by other devices stay open.</text>
  <text x="50" y="508" class="n">At most one new unlock per tick, and no second password prompt can open while one is showing.</text>
</svg>
